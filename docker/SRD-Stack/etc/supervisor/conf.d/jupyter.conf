[program:jupyter]
command=/usr/bin/start-jupyter.sh
directory=/home/ubuntu
user=ubuntu
environment=HOME="/home/ubuntu",USER="ubuntu",SHELL="/bin/bash",JUPYTER_RUNTIME_DIR="/tmp/jupyter/runtime",JUPYTER_DATA_DIR="/home/ubuntu/.local/share/jupyter",XDG_RUNTIME_DIR="/tmp/runtime-ubuntu",XAUTHORITY="/tmp/runtime-ubuntu/.Xauthority",JUPYTER_REMOTE_DESKTOP_PROXY_XSTARTUP="/usr/bin/start-xfce.sh"
autostart=true
autorestart=true
priority=300
stdout_logfile=/var/log/supervisor/jupyter.log
redirect_stderr=true

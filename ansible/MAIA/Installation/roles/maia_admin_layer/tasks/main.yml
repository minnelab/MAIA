---
- name: Include environment variables
  ansible.builtin.include_vars:
    file: "{{ config_folder }}/env.json"
  when: config_folder is defined

- name: Ensure admin_email is set
  set_fact:
    admin_email: "{{ admin_email | default('admin@maia.io') }}"

- name: Read cluster config YAML file
  ansible.builtin.slurp:
    src: "{{ config_folder }}/{{ cluster_name }}.yaml"
  register: cluster_config_content

- name: Extract cluster_name from cluster config
  set_fact:
    cluster_name: "{{ (cluster_config_content.content | b64decode | from_yaml).cluster_name }}"

- name: Extract domain from cluster config
  set_fact:
    domain: "{{ (cluster_config_content.content | b64decode | from_yaml).domain }}"

- name: Ensure DEPLOY_KUBECONFIG is absolute
  ansible.builtin.set_fact:
    DEPLOY_KUBECONFIG: >-
      {{ DEPLOY_KUBECONFIG if DEPLOY_KUBECONFIG is match('^/') else (config_folder ~ '/' ~ DEPLOY_KUBECONFIG) }}
  when: DEPLOY_KUBECONFIG is defined and (DEPLOY_KUBECONFIG is not match('^/'))
  delegate_to: localhost

- name: Create namespaces
  ansible.builtin.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
    state: present
  loop: "{{ maia_admin_namespaces }}"
  delegate_to: localhost
  environment:
    KUBECONFIG: "{{ DEPLOY_KUBECONFIG }}"
    http_proxy: ""
    https_proxy: ""
    HTTP_PROXY: ""
    HTTPS_PROXY: ""

- name: Check if externalCA key exists in cluster config
  ansible.builtin.set_fact:
    external_ca_set: "{{ (cluster_config_content.content | b64decode | from_yaml).keys() | list | select('equalto', 'externalCA') | list | length > 0 }}"
  delegate_to: localhost

- name: Ensure external CA secret exists in maia-dashboard namespace, used by MinIO Tenant
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ (cluster_config_content.content | b64decode | from_yaml).externalCA.name }}"
        namespace: maia-dashboard
      type: Opaque
      data:
        public.crt: "{{ lookup('file', (cluster_config_content.content | b64decode | from_yaml).externalCA.cert) | b64encode }}"
  when: external_ca_set | bool
  delegate_to: localhost
  environment:
    KUBECONFIG: "{{ DEPLOY_KUBECONFIG }}"
    http_proxy: ""
    https_proxy: ""
    HTTP_PROXY: ""
    HTTPS_PROXY: ""

- name: Ensure custom-ca-cert configmap exists in openwebui namespace, used by OpenWebUI
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: custom-ca-cert
        namespace: openwebui
      data:
        ca.crt: "{{ lookup('file', (cluster_config_content.content | b64decode | from_yaml).externalCA.cert) }}"
  when: external_ca_set | bool
  delegate_to: localhost
  environment:
    KUBECONFIG: "{{ DEPLOY_KUBECONFIG }}"
    http_proxy: ""
    https_proxy: ""
    HTTP_PROXY: ""
    HTTPS_PROXY: ""

- name: Run MAIA Admin Toolkit installer
  ansible.builtin.command: >
    MAIA_install_admin_toolkit
    --cluster-config {{ config_folder }}/{{ cluster_name }}.yaml
    --config-folder {{ config_folder }}
  environment:
    argocd_namespace: "{{ argocd_namespace }}"
    admin_group_ID: "{{ admin_group_ID }}"
    ARGOCD_PASSWORD: "{{ ARGOCD_PASSWORD }}"
    admin_project_chart: "{{ admin_project_chart }}"
    admin_project_repo: "{{ admin_project_repo }}"
    admin_project_version: "{{ admin_project_version }}"
    KUBECONFIG: "{{ DEPLOY_KUBECONFIG }}"
    keycloak_client_secret: "{{ keycloak_client_secret }}"
    minio_admin_password: "{{ minio_admin_password }}"
    minio_root_password: "{{ minio_root_password }}"
    dashboard_api_secret: "{{ dashboard_api_secret }}"
    mysql_dashboard_password: "{{ mysql_dashboard_password }}"
    keycloak_admin_password: "{{ keycloak_admin_password }}"
    rancher_token: "{{ rancher_token }}"
    rancher_password: "{{ rancher_password }}"
  register: maia_install_admin_output
  delegate_to: localhost

- name: Show MAIA Admin Toolkit installer output
  ansible.builtin.debug:
    var: maia_install_admin_output.stdout

- name: Change Keycloak Client Secret
  ansible.builtin.command: >
    MAIA_change_keycloak_client_secret --client_secret {{ keycloak_client_secret }} --realm_file {{ config_folder }}/MAIA_realm.json
  delegate_to: localhost
  when: auto_sync | bool


- name: Check if MAIA Realm Import Config Map exists
  ansible.builtin.command: >
    kubectl get configmap -n keycloak maia-realm-import
  register: configmap_check
  failed_when: false
  changed_when: false
  delegate_to: localhost
  environment:
    KUBECONFIG: "{{ DEPLOY_KUBECONFIG }}"
  when: auto_sync | bool


- name: Create MAIA Realm Import Config Map for keycloak
  ansible.builtin.command: >
    kubectl create configmap -n keycloak maia-realm-import --from-file=MAIA_realm.json={{ config_folder }}/MAIA_realm.json
  when: auto_sync | bool and configmap_check.rc != 0
  delegate_to: localhost
  environment:
    KUBECONFIG: "{{ DEPLOY_KUBECONFIG }}"

- name: Install latest argocd CLI
  ansible.builtin.shell: |
    VERSION=$(curl -s https://api.github.com/repos/argoproj/argo-cd/releases/latest | grep tag_name | cut -d '"' -f 4)
    curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/download/$VERSION/argocd-linux-amd64
    chmod +x /usr/local/bin/argocd
  args:
    creates: /usr/local/bin/argocd
  delegate_to: localhost
  when: auto_sync | bool

- name: Login to ArgoCD using CLI (with fallback)
  ansible.builtin.shell: |
    export ARGOCD_SERVER_IP=$(kubectl -n {{ argocd_namespace }} get svc argocd-server -o jsonpath='{.spec.clusterIP}')
    argocd login "argocd.{{ domain }}" --username admin --password "$ARGOCD_PASSWORD" --insecure || \
    argocd login localhost:{{ argocd_port }} --username admin --password "$ARGOCD_PASSWORD" --insecure || \
    yes y | argocd login localhost:{{ argocd_port }} --username admin --password "$ARGOCD_PASSWORD" --insecure || \
    argocd login ${ARGOCD_SERVER_IP}:443 --username admin --password "$ARGOCD_PASSWORD" --insecure || \
    yes y | argocd login ${ARGOCD_SERVER_IP}:443 --username admin --password "$ARGOCD_PASSWORD" --insecure
  environment:
    ARGOCD_PASSWORD: "{{ ARGOCD_PASSWORD }}"
    KUBECONFIG: "{{ DEPLOY_KUBECONFIG }}"
  register: argocd_cli_login
  changed_when: false
  retries: 5
  delay: 10
  until: argocd_cli_login.rc == 0
  delegate_to: localhost
  

- name: Show ArgoCD CLI login output
  ansible.builtin.debug:
    var: argocd_cli_login.stdout
  when: auto_sync | bool
- name: Sync maia-admin-rancher ArgoCD application
  ansible.builtin.shell: |
    argocd app sync maia-admin-rancher
  register: argocd_sync_rancher
  changed_when: false
  ignore_errors: true
  delegate_to: localhost
  when: auto_sync | bool and 'maia-admin-rancher' in maia_admin_argocd_applications
- name: Check if maia-admin-keycloak ArgoCD app is synced
  ansible.builtin.shell: |
    argocd app get maia-admin-keycloak -o json | jq -r '.status.operationState.phase'
  register: keycloak_app_status
  changed_when: false
  failed_when: false
  delegate_to: localhost

- name: Set keycloak_synced fact if app is synced
  ansible.builtin.set_fact:
    keycloak_synced: "{{ keycloak_app_status.stdout == 'Succeeded' }}"

- name: Sync maia-admin-keycloak ArgoCD application
  ansible.builtin.shell: |
    argocd app sync maia-admin-keycloak
  register: argocd_sync_keycloak
  changed_when: false
  ignore_errors: true
  delegate_to: localhost
  when: keycloak_synced == false and auto_sync | bool and 'maia-admin-keycloak' in maia_admin_argocd_applications

- name: Sync maia-admin-admin-toolkit ArgoCD application
  ansible.builtin.shell: |
    argocd app sync maia-admin-admin-toolkit
  register: argocd_sync_admin_toolkit_result
  changed_when: false
  ignore_errors: true
  delegate_to: localhost
  timeout: 120
  when: auto_sync | bool and 'maia-admin-admin-toolkit' in maia_admin_argocd_applications

- name: Wait until maia-admin-keycloak-0 pod is ready
  ansible.builtin.shell: |
    kubectl -n keycloak wait --for=condition=Ready pod/maia-admin-keycloak-0 --timeout=300s
  register: keycloak_pod_ready
  changed_when: false
  delegate_to: localhost
  environment:
    KUBECONFIG: "{{ DEPLOY_KUBECONFIG }}"
  retries: 10
  delay: 10
  until: keycloak_pod_ready.rc == 0
  when: auto_sync | bool 

- name: Download MAIA Keycloak Theme inside Keycloak container
  ansible.builtin.shell: |
    kubectl -n keycloak exec -it maia-admin-keycloak-0 -- sh -c 'curl -f -sSkL -o /opt/bitnami/keycloak/themes/maia-theme.tar.gz https://github.com/minnelab/MAIA/raw/refs/heads/master/keycloak/maia-theme.tar.gz && cd /opt/bitnami/keycloak/themes && tar -xvf maia-theme.tar.gz'
  delegate_to: localhost
  when: auto_sync | bool and keycloak_synced == false
  environment:
    KUBECONFIG: "{{ DEPLOY_KUBECONFIG }}"

- name: Run MAIA_configure_keycloak to configure Keycloak
  ansible.builtin.command: >
    MAIA_configure_keycloak --server_url "https://iam.{{ domain }}" --client_secret "{{ keycloak_client_secret }}" --admin_email "{{ admin_email }}"
  environment:
    KUBECONFIG: "{{ DEPLOY_KUBECONFIG }}"
    no_proxy: "{{ domain }}"
    NO_PROXY: "{{ domain }}"
  register: configure_keycloak_result
  ignore_errors: true
  when: auto_sync | bool and keycloak_synced == false
  delegate_to: localhost
- name: Show output from MAIA_configure_keycloak
  ansible.builtin.debug:
    var: configure_keycloak_result.stdout
  when: auto_sync | bool and keycloak_synced == false
- name: Sync maia-admin-admin-toolkit ArgoCD application
  ansible.builtin.shell: |
    argocd app sync maia-admin-admin-toolkit
  register: argocd_sync_admin_toolkit_result
  changed_when: false
  ignore_errors: true
  delegate_to: localhost
  timeout: 120
  when: auto_sync | bool and 'maia-admin-admin-toolkit' in maia_admin_argocd_applications

- name: Rollout restart argocd-server deployment in argocd namespace
  ansible.builtin.shell: |
    kubectl rollout restart deployment/argocd-server -n argocd
  register: argocd_server_rollout_result
  changed_when: argocd_server_rollout_result.rc == 0
  delegate_to: localhost
  environment:
    KUBECONFIG: "{{ DEPLOY_KUBECONFIG }}"
  when: auto_sync | bool
- name: Login to ArgoCD using CLI (with fallback)
  ansible.builtin.shell: |
    export ARGOCD_SERVER_IP=$(kubectl -n {{ argocd_namespace }} get svc argocd-server -o jsonpath='{.spec.clusterIP}')
    argocd login "argocd.{{ domain }}" --username admin --password "$ARGOCD_PASSWORD" --insecure || \
    argocd login localhost:{{ argocd_port }} --username admin --password "$ARGOCD_PASSWORD" --insecure || \
    yes y | argocd login localhost:{{ argocd_port }} --username admin --password "$ARGOCD_PASSWORD" --insecure || \
    argocd login ${ARGOCD_SERVER_IP}:443 --username admin --password "$ARGOCD_PASSWORD" --insecure || \
    yes y | argocd login ${ARGOCD_SERVER_IP}:443 --username admin --password "$ARGOCD_PASSWORD" --insecure
  environment:
    ARGOCD_PASSWORD: "{{ ARGOCD_PASSWORD }}"
    KUBECONFIG: "{{ DEPLOY_KUBECONFIG }}"
  register: argocd_cli_login
  changed_when: false
  delegate_to: localhost
  when: auto_sync | bool
- name: Sync maia-admin-harbor ArgoCD application
  ansible.builtin.shell: |
    argocd app sync maia-admin-harbor
  register: argocd_sync_admin_harbor_result
  changed_when: false
  ignore_errors: true
  delegate_to: localhost
  retries: 5
  delay: 20
  when: auto_sync | bool and 'maia-admin-harbor' in maia_admin_argocd_applications
- name: Sync maia-core-loginapp ArgoCD application
  ansible.builtin.shell: |
    argocd app sync maia-core-loginapp
  register: argocd_sync_core_loginapp_result
  changed_when: false
  ignore_errors: true
  delegate_to: localhost
  when: auto_sync | bool and 'maia-core-loginapp' in maia_admin_argocd_applications

- name: Wait until maia-admin-minio-tenant-pool-0-0 pod is ready
  ansible.builtin.shell: |
    kubectl -n maia-dashboard wait --for=condition=Ready pod/admin-minio-tenant-pool-0-0 --timeout=300s
  register: minio_pod_ready
  changed_when: false
  delegate_to: localhost
  environment:
    KUBECONFIG: "{{ DEPLOY_KUBECONFIG }}"
  retries: 10
  delay: 10
  until: minio_pod_ready.rc == 0
  when: auto_sync | bool 
- name: Create bucket 'maia-envs' in MinIO Tenant
  ansible.builtin.shell: |
    kubectl -n maia-dashboard exec admin-minio-tenant-pool-0-0 -c minio -- \
      /bin/sh -c 'export MINIO_ROOT_USER="maia-admin"; export MINIO_ROOT_PASSWORD="{{ minio_admin_password }}"; mc alias set local http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; mc mb --ignore-existing local/maia-envs'
  environment:
    KUBECONFIG: '{{ DEPLOY_KUBECONFIG }}'
  delegate_to: localhost
  register: minio_create_bucket_result
  changed_when: false
  when: auto_sync | bool
- name: Create maia-admin-policy.json locally
  copy:
    dest: /tmp/maia-admin-policy.json
    content: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Action": [
              "admin:*"
            ]
          },
          {
            "Effect": "Allow",
            "Action": [
              "kms:*"
            ]
          },
          {
            "Effect": "Allow",
            "Action": [
              "s3:*"
            ],
            "Resource": [
              "arn:aws:s3:::*"
            ]
          }
        ]
      }
  delegate_to: localhost
  when: auto_sync | bool

- name: Copy maia-admin-policy.json to admin-minio-tenant-pool-0-0 pod without kubectl cp (tar not available)
  ansible.builtin.shell: |
    kubectl -n maia-dashboard exec -i admin-minio-tenant-pool-0-0 -c minio -- /bin/sh -c "cat > /tmp/maia-admin-policy.json" < /tmp/maia-admin-policy.json
  environment:
    KUBECONFIG: '{{ DEPLOY_KUBECONFIG }}'
  delegate_to: localhost
  when: auto_sync | bool

- name: Add MAIA Admin as minio admin policy user (retry if policy.json not present)
  ansible.builtin.shell: |
    kubectl -n maia-dashboard exec admin-minio-tenant-pool-0-0 -c minio -- \
      /bin/sh -c 'if [ -f /tmp/maia-admin-policy.json ] && [ -s /tmp/maia-admin-policy.json ]; then mc admin policy create local {{ admin_group_ID }} /tmp/maia-admin-policy.json; else echo "maia-admin-policy.json missing or empty" && exit 42; fi'
  environment:
    KUBECONFIG: '{{ DEPLOY_KUBECONFIG }}'
  delegate_to: localhost
  register: minio_policy_create_result
  retries: 5
  delay: 3
  until: minio_policy_create_result.rc == 0
  when: auto_sync | bool

- name: Sync maia-admin-openwebui ArgoCD application
  ansible.builtin.shell: |
    argocd app sync maia-admin-openwebui
  register: argocd_sync_openwebui_result
  changed_when: false
  ignore_errors: true
  delegate_to: localhost
  when: auto_sync | bool and 'maia-admin-openwebui' in maia_admin_argocd_applications

- name: Sync maia-admin-guacamole ArgoCD application
  ansible.builtin.shell: |
    argocd app sync maia-admin-guacamole
  register: argocd_sync_guacamole_result
  changed_when: false
  ignore_errors: true
  delegate_to: localhost
  when: auto_sync | bool and 'maia-admin-guacamole' in maia_admin_argocd_applications

- name: Wait until guacamole pods are ready
  ansible.builtin.shell: |
    kubectl -n guacamole wait --for=condition=Ready pod --all --timeout=300s
  register: guacamole_pods_ready
  changed_when: false
  delegate_to: localhost
  environment:
    KUBECONFIG: "{{ DEPLOY_KUBECONFIG }}"
  retries: 10
  delay: 10
  until: guacamole_pods_ready.rc == 0
  when: auto_sync | bool and 'maia-admin-guacamole' in maia_admin_argocd_applications

- name: Create Guacamole admin group
  ansible.builtin.shell: |
    set -euo pipefail
    GUACAMOLE_URL="{{ GUACAMOLE_URL | default('https://kubeflow.' ~ domain ~ '/remote-desktops') }}"
    GUACAMOLE_URL="${GUACAMOLE_URL%/}"
    GUACAMOLE_DATA_SOURCE="{{ GUACAMOLE_DATA_SOURCE | default('postgresql') }}"
    GUACAMOLE_USERNAME="{{ GUACAMOLE_USERNAME | default('admin') }}"
    GUACAMOLE_PASSWORD="{{ GUACAMOLE_PASSWORD }}"
    GROUP_NAME="{{ admin_group_ID }}"
    GROUP_NAME_ENC=$(printf '%s' "$GROUP_NAME" | jq -sRr @uri)

    AUTH_RESP=$(curl -sk -X POST "${GUACAMOLE_URL}/api/tokens" \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -d "username=${GUACAMOLE_USERNAME}" \
      -d "password=${GUACAMOLE_PASSWORD}")
    if ! echo "$AUTH_RESP" | jq -e '.authToken != null and .authToken != ""' >/dev/null 2>&1; then
      echo "Failed to authenticate to Guacamole at ${GUACAMOLE_URL}/api/tokens" >&2
      echo "Response: ${AUTH_RESP}" >&2
      exit 1
    fi
    AUTH_TOKEN=$(echo "$AUTH_RESP" | jq -r '.authToken')

    GROUP_HTTP=$(curl -sk -o /tmp/guacamole_group_resp.txt -w "%{http_code}" -X POST \
      "${GUACAMOLE_URL}/api/session/data/${GUACAMOLE_DATA_SOURCE}/userGroups?token=${AUTH_TOKEN}" \
      -H "Content-Type: application/json" \
      -d "{\"identifier\":\"${GROUP_NAME}\",\"attributes\":{}}")
    GROUP_BODY=$(cat /tmp/guacamole_group_resp.txt)
    if [ "$GROUP_HTTP" != "200" ] && [ "$GROUP_HTTP" != "204" ]; then
      if echo "$GROUP_BODY" | grep -qi 'already exists'; then
        echo "Group '${GROUP_NAME}' already exists, continuing"
      else
        echo "Failed to create group '${GROUP_NAME}' (HTTP ${GROUP_HTTP}): ${GROUP_BODY}" >&2
        exit 1
      fi
    fi

    PERM_HTTP=$(curl -sk -o /tmp/guacamole_perm_resp.txt -w "%{http_code}" -X PATCH \
      "${GUACAMOLE_URL}/api/session/data/${GUACAMOLE_DATA_SOURCE}/userGroups/${GROUP_NAME_ENC}/permissions?token=${AUTH_TOKEN}" \
      -H "Content-Type: application/json" \
      -d '[{"op":"add","path":"/systemPermissions","value":"ADMINISTER"}]')
    if [ "$PERM_HTTP" != "200" ] && [ "$PERM_HTTP" != "204" ]; then
      echo "Failed to assign admin permissions to '${GROUP_NAME}' (HTTP ${PERM_HTTP}): $(cat /tmp/guacamole_perm_resp.txt)" >&2
      exit 1
    fi
    echo "$PERM_HTTP"
  args:
    executable: /bin/bash
  register: guacamole_admin_group_result
  environment:
    no_proxy: "{{ domain }},localhost,127.0.0.1"
    NO_PROXY: "{{ domain }},localhost,127.0.0.1"
  changed_when: false
  retries: 30
  delay: 10
  until: guacamole_admin_group_result.rc == 0
  delegate_to: localhost
  when: auto_sync | bool and 'maia-admin-guacamole' in maia_admin_argocd_applications and GUACAMOLE_PASSWORD is defined

- name: Show Guacamole admin group creation output
  ansible.builtin.debug:
    var: guacamole_admin_group_result.stdout
  when: auto_sync | bool and 'maia-admin-guacamole' in maia_admin_argocd_applications and guacamole_admin_group_result is defined


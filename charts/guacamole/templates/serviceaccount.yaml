{{- if .Values.guacamole.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "guacamole.serviceAccountName" . }}
  labels:
    {{- include "guacamole.guacamoleLabels" . | nindent 4 }}
  {{- with .Values.guacamole.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.guacamole.serviceAccount.automount }}
{{- end }}

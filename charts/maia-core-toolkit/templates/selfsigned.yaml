{{ if .Values.selfsigned.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: kubernetes-ca-issuer
spec:
  ca:
    secretName: kubernetes-ca
---
apiVersion: v1
data:
  hosts.server: |
    {{ .Values.selfsigned.cluster_domain }}:53 {
    hosts {
        {{ .Values.selfsigned.coredns_ip }} iam.{{ .Values.selfsigned.cluster_domain }}
        {{ .Values.selfsigned.coredns_ip }} registry.{{ .Values.selfsigned.cluster_domain }}
        {{ .Values.selfsigned.coredns_ip }} mgmt.{{ .Values.selfsigned.cluster_domain }}
        {{ .Values.selfsigned.coredns_ip }} argocd.{{ .Values.selfsigned.cluster_domain }}
        {{ .Values.selfsigned.coredns_ip }} kubeflow.{{ .Values.selfsigned.cluster_domain }}
        {{ .Values.selfsigned.coredns_ip }} {{ .Values.selfsigned.cluster_domain }}
        fallthrough
      }
      # Any other <name>.<domain> (maia, chat, login, minio, per-project hosts, ...) is served by the
      # same ingress IP; without this, names missing from the list above return SERVFAIL in-cluster.
      template IN A {{ .Values.selfsigned.cluster_domain }} {
        answer "{{ "{{" }} .Name {{ "}}" }} 60 IN A {{ .Values.selfsigned.coredns_ip }}"
        fallthrough
      }
      # No IPv6 for these names: answer AAAA with NOERROR/no data instead of SERVFAIL
      template IN AAAA {{ .Values.selfsigned.cluster_domain }} {
        rcode NOERROR
      }
    }
kind: ConfigMap
metadata:
  labels:
    k0s.k0sproject.io/stack: coredns
  name: coredns-custom
  namespace: kube-system
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  defaultCertificate:
    secretName: wildcard-domain-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-domain-tls
  namespace: traefik
spec:
  secretName: wildcard-domain-tls
  dnsNames:
    - "{{ .Values.selfsigned.cluster_domain }}"
    - "*.{{ .Values.selfsigned.cluster_domain }}"
  issuerRef:
    name: kubernetes-ca-issuer
    kind: ClusterIssuer
{{ end }}
{{- if or .Values.ehrbase.enabled .Values.ehrdb.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ehrbase.db.secretName" . }}
  labels:
    {{- include "ehrbase.labels" . | nindent 4 }}
    app.kubernetes.io/component: ehrbase-db
type: Opaque
stringData:
  user: {{ .Values.ehrbase.db.user | quote }}
  userAdmin: {{ .Values.ehrbase.db.userAdmin | quote }}
  password: {{ .Values.ehrbase.db.password | quote }}
  passwordAdmin: {{ .Values.ehrbase.db.passwordAdmin | quote }}
{{- end }}

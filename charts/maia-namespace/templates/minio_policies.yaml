{{- if and .Values.minio.enabled .Values.minio.inject_policies }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.minio.namespace }}-policy-setup
  namespace: {{ .Values.minio.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded, BeforeHookCreation
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: {{ .Values.minio.mcImage | default "quay.io/minio/mc:RELEASE.2025-04-08T15-39-49Z" }}
        env:
        - name: MINIO_ROOT_USER
          value: {{ .Values.minio.accessKey | quote }}
        - name: MINIO_ROOT_PASSWORD
          value: {{ .Values.minio.secretKey | quote }}
        - name: MINIO_ENDPOINT
          value: http://minio.{{ .Values.minio.namespace }}.svc.cluster.local:80
        - name: USER_GROUP_POLICY
          value: MAIA:{{ .Values.minio.namespace }}
        - name: ADMIN_GROUP_POLICY
          value: {{ .Values.minio.admin_group_ID | quote }}
        command:
        - /bin/sh
        - -c
        - |
          set -eu

          echo "Waiting for MinIO Tenant to become ready..."
          until mc alias set myminio "$MINIO_ENDPOINT" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
            echo "MinIO is not ready yet, retrying in 10 seconds..."
            sleep 10
          done
          echo "MinIO is reachable."

          # Full admin privileges inside MinIO (maps to OIDC group claims)
          printf '%s\n' \
            '{' \
            '  "Version": "2012-10-17",' \
            '  "Statement": [' \
            '    {"Effect": "Allow", "Action": ["admin:*"]},' \
            '    {"Effect": "Allow", "Action": ["kms:*"]},' \
            '    {"Effect": "Allow", "Action": ["s3:*"], "Resource": ["arn:aws:s3:::*"]}' \
            '  ]' \
            '}' > /tmp/admin-policy.json

          create_or_replace_policy() {
            POLICY_NAME="$1"
            echo "Ensuring policy '${POLICY_NAME}' exists with admin privileges..."
            if mc admin policy info myminio "${POLICY_NAME}" >/dev/null 2>&1; then
              mc admin policy remove myminio "${POLICY_NAME}"
            fi
            mc admin policy create myminio "${POLICY_NAME}" /tmp/admin-policy.json
            echo "Policy '${POLICY_NAME}' applied."
          }

          # User group for this namespace (Keycloak group claim)
          create_or_replace_policy "${USER_GROUP_POLICY}"
          # Cluster admin group (Keycloak group claim)
          create_or_replace_policy "${ADMIN_GROUP_POLICY}"

          echo "MinIO policy setup complete for user group '${USER_GROUP_POLICY}' and admin group '${ADMIN_GROUP_POLICY}'."
{{- end }}

{{ if .Values.create_kubeflow_cluster_role }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maia-profile-creator
rules:
  - apiGroups:
      - "kubeflow.org"
    resources:
      - "profiles"
    verbs:
      - "create"
      - "get"
      - "list"
      - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maia-profile-creator-binding
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: maia-profile-creator
  apiGroup: rbac.authorization.k8s.io
{{ end }}
[tool.black]
line-length = 130
include = '\.pyi?$'
exclude = '''
    /(
        \.git
      | \.hg
      | \.mypy_cache
      | \.tox
      | \.venv
      | _build
      | buck-out
      | build
      | dist
      # The following are specific to Black, you probably don't want those.
      | blib2to3
      | tests/data
    )/
'''

# Pin the Ruff 0.15 default rule set. Ruff 0.16 expanded defaults from 59 to 413
# rules, which is why unpinned CI (`pip install ruff`) failed while local 0.15 passed.
[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
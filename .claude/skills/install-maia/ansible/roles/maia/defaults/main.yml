---
# Adapted from verdi-ansible roles/maia. No Vault, no proxy, no LLM endpoints, no site users.
maia_branch: "157-add-tool-for-mcp-server-to-execute-helm-commands-from-dashboard"
maia_cluster_domain: maia.local
maia_cluster_name: maia-vm
maia_config_dir: /etc/maia-config
maia_user: maia                       # 40_render_config.sh sets this from `ssh -G <guest>`
maia_internal_ip: "{{ ansible_default_ipv4.address }}"
maia_control_plane_hostname: "{{ ansible_hostname }}"
maia_data_dir: /mnt/maia-data
volume_path: ""                       # block device for maia_data_dir; empty means use the root disk
maia_k3s_config_dir: /etc/rancher/k3s
maia_k3s_data_dir: "{{ maia_data_dir }}/k3s"
maia_k3s_flannel_backend: vxlan
maia_k3s_kubelet_args:
  - "root-dir={{ maia_data_dir }}/kubelet"
  - "feature-gates=KubeletInUserNamespace=true"
maia_k3s_version: v1.35.4+k3s1
maia_traefik_plugins_dir: /var/lib/traefik/plugins/src/github.com/sevensolutions
maia_traefik_oidc_auth_version: "0.17.0"
maia_traefik_oidc_auth_url: "https://github.com/sevensolutions/traefik-oidc-auth/archive/refs/tags/v{{ maia_traefik_oidc_auth_version }}.zip"
maia_raw_base: "https://raw.githubusercontent.com/minnelab/MAIA/refs/heads/{{ maia_branch }}"
maia_collection_path: "git+https://github.com/minnelab/MAIA.git#/ansible/MAIA/Installation,{{ maia_branch }}"

# Steps written to config.yaml, and so run by main.sh / install_MAIA.sh. 50_install.sh renders only the
# bootstrap steps here and runs the rest one at a time with maia-step.sh.
maia_steps: [prepare_hosts, configure_hosts, install_k3s, install_maia_core, install_maia_admin,
             configure_oidc_authentication, configure_maia_dashboard]

# Versions: a dev branch gets "<x>-preview" images and MAIA_TAG=<branch>; on master, set release versions.
maia_version: 2.6.0-preview
maia_dashboard_image_version: 2.6.0-preview
maia_tag: "{{ maia_branch }}"
# Extra config.yaml env keys (chart versions etc., see MAIA/versions.py). ADMIN_PROJECT_CHART_VERSION 1.3.1 is required for
# Guacamole: versions.py defaults to 1.3.0, which has no guacamole_app.yaml (upstream bug; verdi pins 1.3.1 too).
maia_env_overrides:
  ADMIN_PROJECT_CHART_VERSION: "1.3.1"
# Git-sourced charts (`*_CHART_TYPE: git_repo` in MAIA/versions.py) default to `master`. For any other branch, pin them to the
# branch so charts match the code under test (verdi pinned a subset). charts/guacamole doesn't exist on master yet.
maia_branch_chart_keys: [CORE_TOOLKIT_CHART_VERSION, LOCAL_PATH_CHART_VERSION, KUBEFLOW_CHART_VERSION, ADMIN_TOOLKIT_CHART_VERSION,
                         MAIA_DASHBOARD_CHART_VERSION, GUACAMOLE_CHART_VERSION, MAIA_NAMESPACE_CHART_VERSION,
                         MAIA_FILEBROWSER_CHART_VERSION, MAIA_ORTHANC_CHART_VERSION, MAIA_KUBEFLOW_CHART_VERSION,
                         MAIA_NVFLARE_DASHBOARD_CHART_VERSION, MAIA_EHRBASE_CHART_VERSION, KANIKO_CHART_VERSION, MKG_CHART_VERSION,
                         GPU_BOOKING_CHART_VERSION]

# Components (verdi set)
maia_core_apps: [maia-core-traefik, maia-core-local-path, maia-core-cert-manager, maia-core-metallb,
                 maia-core-toolkit, maia-core-minio-operator, maia-core-nfs-provisioner, maia-core-kubeflow]
maia_admin_apps: [maia-admin-admin-toolkit, maia-admin-keycloak, maia-admin-harbor, maia-core-loginapp,
                  maia-admin-openwebui, maia-admin-guacamole]
maia_install_kyverno: true
maia_install_argocd: true
maia_prepare_ufw: true

# OpenWebUI LLM backends: off unless set (verdi pointed at site-internal 10.36.x hosts)
maia_openai_api_base_urls: ""         # "http://host:8000/v1;http://host2/v1"
maia_openai_api_keys: ""
maia_openai_api_configs: ""
maia_default_models: ""
maia_openwebui_model: ""

# Secrets: supplied by 40_render_config.sh via -e @secrets.yml. No defaults on purpose.
# maia_keycloak_client_secret, maia_openwebui_admin_password, maia_webui_secret_key,
# maia_agent_api_token, maia_guacamole_password, maia_harbor_admin_password

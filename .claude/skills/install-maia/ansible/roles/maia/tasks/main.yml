---
# Renders /etc/maia-config and host prerequisites. Doesn't install MAIA: 50_install.sh runs main.sh / maia-step.sh
# over SSH so their output streams into the control node's logs.
- name: Check that the generated secrets were supplied
  ansible.builtin.assert:
    that:
      - maia_keycloak_client_secret | default('') | length >= 16
      - maia_openwebui_admin_password | default('') | length >= 16
      - maia_webui_secret_key | default('') | length >= 16
      - maia_guacamole_password | default('') | length >= 16
      - maia_harbor_admin_password | default('') | length >= 16
    quiet: true
  no_log: true

- name: Check that become works without a password
  ansible.builtin.command: sudo -n true
  become: false
  changed_when: false

- name: Ensure Maia config directory exists
  ansible.builtin.file:
    path: "{{ maia_config_dir }}"
    state: directory
    owner: "{{ maia_user }}"
    group: "{{ maia_user }}"
    mode: "0750"

- name: Write Maia Ansible inventory
  ansible.builtin.template:
    src: inventory.j2
    dest: "{{ maia_config_dir }}/inventory"
    owner: "{{ maia_user }}"
    group: "{{ maia_user }}"
    mode: "0640"

# The cluster CA (k3s server CA, which signs the ingress certs) exists only after install_k3s. 50_install's external-ca step
# writes it here and re-renders, which adds `externalCA` to config.yaml (see troubleshooting: rootCA["cert"] bug).
- name: Check for the cluster CA written by the external-ca step
  ansible.builtin.stat:
    path: "{{ maia_config_dir }}/maia-ca.crt"
  register: maia_ca_file

- name: Read existing config.yaml (to keep the OpenWebUI API key MAIA wrote into it)
  ansible.builtin.slurp:
    src: "{{ maia_config_dir }}/config.yaml"
  register: maia_config_content
  failed_when: false
  no_log: true

- name: Keep env.OPENWEBUI_API_KEY from the existing config.yaml
  ansible.builtin.set_fact:
    maia_existing_openwebui_api_key: >-
      {{ ((maia_config_content.content | b64decode | from_yaml).env | default({})).OPENWEBUI_API_KEY | default('', true) }}
  when: maia_config_content.content is defined
  no_log: true

- name: Write Maia config.yaml (contains secrets)
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ maia_config_dir }}/config.yaml"
    owner: "{{ maia_user }}"
    group: "{{ maia_user }}"
    mode: "0600"
  no_log: true

- name: Check for env.json
  ansible.builtin.stat:
    path: "{{ maia_config_dir }}/env.json"
  register: maia_env_json

# MAIA_Configure_Installation.sh keeps these from env.json instead of generating them:
# - keycloak_client_secret, so OpenWebUI's OAUTH_CLIENT_SECRET matches the Keycloak client;
# - openwebui_admin_password, which must equal WEBUI_ADMIN_PASSWORD in config.yaml, because maia_admin_layer signs in to
#   OpenWebUI with it to fetch the API key (otherwise HTTP 400 "email or password provided is incorrect").
# Set on every render, so an env.json from an older run gets them too. The other passwords are generated by MAIA.
- name: Read existing env.json
  ansible.builtin.slurp:
    src: "{{ maia_config_dir }}/env.json"
  register: maia_env_json_content
  when: maia_env_json.stat.exists
  no_log: true

- name: Pin the skill's secrets in env.json
  ansible.builtin.copy:
    dest: "{{ maia_config_dir }}/env.json"
    content: >-
      {{ ((maia_env_json_content.content | b64decode | from_json) if maia_env_json.stat.exists else {})
         | combine(maia_pinned_env) | to_nice_json }}
    owner: "{{ maia_user }}"
    group: "{{ maia_user }}"
    mode: "0600"
  vars:
    maia_pinned_env:
      keycloak_client_secret: "{{ maia_keycloak_client_secret }}"
      openwebui_admin_password: "{{ maia_openwebui_admin_password }}"
  no_log: true

- name: Mount data volume on maia_data_dir
  ansible.posix.mount:
    path: "{{ maia_data_dir }}"
    src: "{{ volume_path }}"
    fstype: ext4
    opts: defaults
    state: mounted
  when: volume_path | length > 0          # verdi used `is defined`, which is also true for ""

- name: Ensure k3s config and rancher directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ maia_k3s_config_dir }}", mode: "0755"}
    - {path: "{{ maia_k3s_config_dir }}/config.yaml.d", mode: "0755"}
    - {path: /var/lib/rancher, mode: "0755"}

# Owned by maia_user, as verdi's recursive chown of maia_data_dir left it: the collection runs `k3s kubectl` without
# become, and with `data-dir` set in /etc/rancher/k3s/config.yaml a non-root k3s must traverse this dir to find its
# extracted binaries ("Error: extracting data: permission denied" otherwise).
- name: Ensure k3s data directory exists (owned by the MAIA user)
  ansible.builtin.file:
    path: "{{ maia_k3s_data_dir }}"
    state: directory
    owner: "{{ maia_user }}"
    group: "{{ maia_user }}"
    mode: "0700"

# First render only (force: false). The upstream k3s role later edits this file (adds `disable: [traefik]`), and
# overwriting it on a re-render brings k3s's bundled traefik back on the next k3s restart.
- name: Write k3s config.yaml (first render only)
  ansible.builtin.template:
    src: k3s-config.yaml.j2
    dest: "{{ maia_k3s_config_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0644"
    force: false

# MAIA installs its own local-path provisioner (maia-core-local-path) with the same provisioner, StorageClass and
# ClusterRoleBinding names as k3s's bundled local-storage addon, which k3s re-applies on every start, so MAIA's copy
# loses its RBAC after a reboot. A drop-in with `disable+` (append) survives the k3s role's list-replacing combine.
- name: Disable k3s bundled local-storage (MAIA ships its own)
  ansible.builtin.copy:
    dest: "{{ maia_k3s_config_dir }}/config.yaml.d/50-install-maia.yaml"
    content: |
      # install-maia: MAIA's maia-core-local-path replaces k3s's local-storage addon
      disable+:
        - local-storage
    owner: root
    group: root
    mode: "0644"

- name: Link rancher k3s state to the data dir
  ansible.builtin.file:
    src: "{{ maia_k3s_data_dir }}"
    dest: /var/lib/rancher/k3s
    state: link
    force: true

- name: Ensure traefik OIDC plugin directory exists
  ansible.builtin.file:
    path: "{{ maia_traefik_plugins_dir }}"
    state: directory
    owner: "{{ maia_user }}"
    group: "{{ maia_user }}"
    mode: "0755"

- name: Download and extract traefik-oidc-auth plugin
  ansible.builtin.unarchive:
    src: "{{ maia_traefik_oidc_auth_url }}"
    dest: "{{ maia_traefik_plugins_dir }}"
    remote_src: true
    owner: "{{ maia_user }}"
    group: "{{ maia_user }}"
    creates: "{{ maia_traefik_plugins_dir }}/traefik-oidc-auth"

- name: Rename traefik-oidc-auth plugin directory
  ansible.builtin.command:
    cmd: mv "traefik-oidc-auth-{{ maia_traefik_oidc_auth_version }}" traefik-oidc-auth
    chdir: "{{ maia_traefik_plugins_dir }}"
    creates: "{{ maia_traefik_plugins_dir }}/traefik-oidc-auth"

- name: Ensure Maia data dir ownership
  ansible.builtin.file:
    path: "{{ maia_data_dir }}"
    state: directory
    owner: "{{ maia_user }}"
    group: "{{ maia_user }}"
    mode: "0755"

- name: Download install scripts for the branch
  ansible.builtin.get_url:
    url: "{{ maia_raw_base }}/{{ item.src }}"
    dest: "{{ maia_config_dir }}/{{ item.dest }}"
    owner: "{{ maia_user }}"
    group: "{{ maia_user }}"
    mode: "0755"
    force: true
  loop:
    - {src: ansible/utils/install_k3s.sh, dest: install_k3s.sh}
    - {src: install_MAIA.sh, dest: install_MAIA.sh}

- name: Generate rsa key for cifs access (kept from verdi; cifs is disabled)
  ansible.builtin.command:
    cmd: ssh-keygen -q -t rsa -b 4096 -N "" -f {{ maia_config_dir }}/cifs_key
    creates: "{{ maia_config_dir }}/cifs_key"
  become: false

- name: Write main.sh and maia-step.sh
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ maia_config_dir }}/{{ item }}"
    owner: "{{ maia_user }}"
    group: "{{ maia_user }}"
    mode: "0755"
  loop: [main.sh, maia-step.sh]

# Upstream (17): maia_admin_layer's "Generate OpenWebUI API Key" calls MAIA_fetch_openwebui_api_key, which the MAIA package
# doesn't ship yet, and the task has no ignore_errors, so install_maia_admin always fails there. The tasks after it already
# tolerate a missing key. This stub prints an empty key, so OPENWEBUI_API_KEY stays "" as before. It's written only where
# no real command exists, and a later pip install of a MAIA release that has one overwrites it.
- name: Check for MAIA_fetch_openwebui_api_key
  ansible.builtin.shell: PATH="$HOME/.local/bin:$PATH" command -v MAIA_fetch_openwebui_api_key
  become: true
  become_user: "{{ maia_user }}"
  register: maia_fetch_key_cmd
  changed_when: false
  failed_when: false

- name: Ensure ~/.local/bin exists for the MAIA user
  ansible.builtin.file:
    path: "/home/{{ maia_user }}/.local/bin"
    state: directory
    owner: "{{ maia_user }}"
    group: "{{ maia_user }}"
    mode: "0755"
  when: maia_fetch_key_cmd.rc != 0

- name: Install a no-op MAIA_fetch_openwebui_api_key stub (upstream command missing)
  ansible.builtin.copy:
    dest: "/home/{{ maia_user }}/.local/bin/MAIA_fetch_openwebui_api_key"
    owner: "{{ maia_user }}"
    group: "{{ maia_user }}"
    mode: "0755"
    force: false
    content: |
      #!/bin/sh
      # install-maia stub, see references/troubleshooting.md "UPSTREAM (17)". Prints an empty key and succeeds.
      echo "MAIA_fetch_openwebui_api_key: stub from install-maia, no API key generated" >&2
      echo ""
  when: maia_fetch_key_cmd.rc != 0

- name: Raise inotify limits
  ansible.posix.sysctl:
    name: "{{ item.k }}"
    value: "{{ item.v }}"
    sysctl_set: true
    reload: true
  loop:
    - {k: fs.inotify.max_user_instances, v: "1280"}
    - {k: fs.inotify.max_user_watches, v: "655360"}

# cloud-init's manage_etc_hosts (set in the QEMU seed) rewrites /etc/hosts on every boot, which wipes the
# <domain> mappings that MAIA's configure_hosts step adds. Keep /etc/hosts as it is after the first boot.
- name: Stop cloud-init from regenerating /etc/hosts on boot
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-install-maia.cfg
    content: "manage_etc_hosts: false\n"
    mode: "0644"

- name: Map cluster hostnames to localhost
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 {{ item }}.{{ maia_cluster_domain }}"
  loop: [iam, kubeflow, chat]   # chat: maia_admin_layer fetches the OpenWebUI API key from https://chat.<domain>
